name: Create OCI Always Free Instance

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  launch-instance:
    runs-on: ubuntu-latest
    steps:
      - name: Install OCI CLI
        run: |
          bash -c "$(curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh)" -- --accept-all-defaults
          echo "/home/runner/bin" >> $GITHUB_PATH

      - name: Configure OCI CLI
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_KEY_FILE }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          cat <<EOF > ~/.oci/config
          [DEFAULT]
          user=${{ secrets.USER_OCID }}
          fingerprint=${{ secrets.FINGERPRINT }}
          tenancy=${{ secrets.TENANCY_OCID }}
          region=${{ secrets.REGION }}
          key_file=~/.oci/oci_api_key.pem
          EOF

      - name: Setup SSH Key File
        run: |
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > /tmp/ssh_key.pub

      - name: Safe Retrying Loop (6 Min Interval - Max 5 Hours)
        run: |
          AD=$(oci iam availability-domain list --query "data[0].name" --raw-output)
          echo "Using Availability Domain: $AD"

          IMAGE=$(oci compute image list --compartment-id "${{ secrets.COMPARTMENT_ID }}" --operating-system "Canonical Ubuntu" --operating-system-version "22.04" --shape "VM.Standard.A1.Flex" --sort-by TIMECREATED --sort-order DESC --query "data[0].id" --raw-output)
          echo "Using Image ID: $IMAGE"

          # 50 attempts x 360s (6 mins) = 300 minutes (5 hours)
          for i in {1..50}
          do
            echo "=========================================="
            echo "Attempt #$i at $(date)"

            # Check existing active instances
            NODE1=$(oci compute instance list \
              --compartment-id "${{ secrets.COMPARTMENT_ID }}" \
              --display-name "ARM-Node-1" \
              --query "data[?\"lifecycle-state\"=='RUNNING' || \"lifecycle-state\"=='PROVISIONING'].id | [0]" \
              --raw-output)

            NODE2=$(oci compute instance list \
              --compartment-id "${{ secrets.COMPARTMENT_ID }}" \
              --display-name "ARM-Node-2" \
              --query "data[?\"lifecycle-state\"=='RUNNING' || \"lifecycle-state\"=='PROVISIONING'].id | [0]" \
              --raw-output)

            TARGET=""
            if [ -z "$NODE1" ] || [ "$NODE1" == "None" ]; then
              TARGET="ARM-Node-1"
            elif [ -z "$NODE2" ] || [ "$NODE2" == "None" ]; then
              TARGET="ARM-Node-2"
            else
              echo "::notice ::Both ARM-Node-1 and ARM-Node-2 are created and active!"
              exit 0
            fi

            echo "Targeting creation of: $TARGET"

            RESPONSE=$(oci compute instance launch \
              --availability-domain "$AD" \
              --compartment-id "${{ secrets.COMPARTMENT_ID }}" \
              --shape "VM.Standard.A1.Flex" \
              --shape-config '{"ocpus":1,"memoryInGBs":6}' \
              --boot-volume-size-in-gbs 50 \
              --image-id "$IMAGE" \
              --subnet-id "${{ secrets.SUBNET_ID }}" \
              --assign-public-ip true \
              --display-name "$TARGET" \
              --ssh-authorized-keys-file "/tmp/ssh_key.pub" 2>&1) || true

            if echo "$RESPONSE" | grep -q '"lifecycle-state": "PROVISIONING"'; then
              echo "SUCCESS: $TARGET launched successfully!"
            elif echo "$RESPONSE" | grep -q "TooManyRequests"; then
              echo "Rate limited. Waiting 8 minutes..."
              sleep 480
            else
              echo "Out of capacity. Waiting 6 minutes for next retry..."
            fi

            sleep 360
          done
