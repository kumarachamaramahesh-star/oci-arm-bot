name: Create OCI Always Free Instance

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  launch-instance:
    runs-on: ubuntu-latest
    steps:
      - name: Setup OCI CLI
        uses: oracle-actions/setup-cli@v1
        with:
          user_ocid: ${{ secrets.USER_OCID }}
          fingerprint: ${{ secrets.FINGERPRINT }}
          tenancy_ocid: ${{ secrets.TENANCY_OCID }}
          region: ${{ secrets.REGION }}
          api_key: ${{ secrets.OCI_KEY_FILE }}

      - name: Get Availability Domain
        id: get-ad
        run: |
          AD=$(oci iam availability-domain list --region ${{ secrets.REGION }} --query "data[0].name" --raw-output)
          echo "ad_name=$AD" >> $GITHUB_OUTPUT

      - name: Attempt to Launch Instance
        id: create-instance
        run: |
          RESPONSE=$(oci compute instance launch \
            --availability-domain "${{ steps.get-ad.outputs.ad_name }}" \
            --compartment-id "${{ secrets.COMPARTMENT_ID }}" \
            --shape "VM.Standard.A1.Flex" \
            --shape-config '{"ocpus":4,"memoryInGBs":24}' \
            --image-id "${{ secrets.IMAGE_ID }}" \
            --subnet-id "${{ secrets.SUBNET_ID }}" \
            --assign-public-ip true \
            --display-name "Free-ARM-Instance" \
            --ssh-authorized-keys "${{ secrets.SSH_PUBLIC_KEY }}" 2>&1) || true
          
          echo "$RESPONSE"

          if echo "$RESPONSE" | grep -q "Out of host capacity"; then
            echo "::warning ::Capacity unavailable right now. Will retry automatically."
            exit 0
          elif echo "$RESPONSE" | grep -q '"lifecycle-state": "PROVISIONING"'; then
            echo "::notice ::Instance launched successfully! Check your Oracle Cloud Console."
            exit 0
          else
            echo "::warning ::Temporary response or retry condition met."
            exit 0
          fi
