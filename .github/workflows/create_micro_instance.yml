name: Create OCI AMD Micro Instance

on:
  workflow_dispatch:

jobs:
  launch-micro:
    runs-on: ubuntu-latest
    steps:
      - name: Install OCI CLI
        run: |
          bash -c "$(curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh)" -- --accept-all-defaults
          echo "/home/runner/bin" >> $GITHUB_PATH

      - name: Configure OCI CLI
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_KEY_FILE }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          cat <<EOF > ~/.oci/config
          [DEFAULT]
          user=${{ secrets.USER_OCID }}
          fingerprint=${{ secrets.FINGERPRINT }}
          tenancy=${{ secrets.TENANCY_OCID }}
          region=${{ secrets.REGION }}
          key_file=~/.oci/oci_api_key.pem
          EOF

      - name: Setup SSH Key File
        run: |
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > /tmp/ssh_key.pub

      - name: Get Availability Domain and Micro Image
        id: get-info
        run: |
          AD=$(oci iam availability-domain list --query "data[0].name" --raw-output)
          echo "ad_name=$AD" >> $GITHUB_OUTPUT
          
          IMAGE=$(oci compute image list --compartment-id "${{ secrets.COMPARTMENT_ID }}" --operating-system "Canonical Ubuntu" --operating-system-version "22.04" --shape "VM.Standard.E2.1.Micro" --sort-by TIMECREATED --sort-order DESC --query "data[0].id" --raw-output)
          echo "image_id=$IMAGE" >> $GITHUB_OUTPUT

      - name: Launch Micro Instance
        run: |
          RESPONSE=$(oci compute instance launch \
            --availability-domain "${{ steps.get-info.outputs.ad_name }}" \
            --compartment-id "${{ secrets.COMPARTMENT_ID }}" \
            --shape "VM.Standard.E2.1.Micro" \
            --image-id "${{ steps.get-info.outputs.image_id }}" \
            --subnet-id "${{ secrets.SUBNET_ID }}" \
            --assign-public-ip true \
            --display-name "AMD-Micro-1" \
            --ssh-authorized-keys-file "/tmp/ssh_key.pub")
          
          echo "$RESPONSE"
          echo "::notice ::AMD Micro Instance created successfully!"
